<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Endereço antigo do Checklist Escovação. Agora é https://escovacao.github.io/ -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist Escovação</title>
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<script>
(function () {
  var q = location.search;
  if (!/[?&]t=/.test(q)) {
    try { var t = localStorage.getItem('checklist-token'); if (t) q = '?t=' + encodeURIComponent(t); } catch (e) {}
  }
  location.replace('https://escovacao.github.io/' + q);
})();
</script>
</head>
<body style="font-family:system-ui,sans-serif;text-align:center;padding:48px 20px">
<p>O Checklist Escovação mudou de endereço: <a href="https://escovacao.github.io/">escovacao.github.io</a></p>
</body>
</html>
